experiment:
  name: paired_rgb_sidd_tiny_nafnet_lite_l1_1000
  seed: 42
  output_dir: runs/paired_rgb_sidd_tiny_nafnet_lite_l1_1000

data:
  dataset: paired_image
  patch_size: 128
  train_size: 1000
  val_size: 200
  train:
    noisy_dir: datasets/sidd_tiny/train/noisy
    clean_dir: datasets/sidd_tiny/train/clean
  val:
    noisy_dir: datasets/sidd_tiny/val/noisy
    clean_dir: datasets/sidd_tiny/val/clean
  noise:
    type: real_paired_rgb
    sigma_min: 0.0
    sigma_max: 0.0

model:
  name: nafnet_lite
  in_channels: 3
  out_channels: 3
  width: 16
  middle_blocks: 2
  encoder_blocks: [1, 1]
  decoder_blocks: [1, 1]
  residual: false

train:
  steps: 1000
  batch_size: 2
  learning_rate: 0.001
  weight_decay: 0.0
  loss: l1
  log_every: 50
  val_every: 200
  num_workers: 0
  device: auto
