# 中文说明：Stage2 AI ISP 实验配置 `low light sidd tiny unet l1 300`。
# 作用：集中声明数据集、模型、损失、优化器、训练步数、验证和输出目录。
# 阅读方式：先看 dataset/model/loss 确认实验目标，再看 train/val/output 确认可复现细节。
experiment:
  name: low_light_sidd_tiny_unet_l1_300
  seed: 42
  output_dir: runs/low_light_sidd_tiny_unet_l1_300

data:
  dataset: paired_image
  patch_size: 128
  train_size: 600
  val_size: 200
  train:
  # 中文说明：batch、学习率、步数、随机种子等训练控制项。
    noisy_dir: datasets/sidd_low_light_tiny/train/noisy
    clean_dir: datasets/sidd_low_light_tiny/train/clean
  val:
  # 中文说明：验证频率、验证样本数和评估时使用的数据设置。
    noisy_dir: datasets/sidd_low_light_tiny/val/noisy
    clean_dir: datasets/sidd_low_light_tiny/val/clean
  noise:
    type: synthetic_low_light
    sigma_min: 0.0
    sigma_max: 0.0

model:
  # 中文说明：网络结构名称及宽度、深度等模型超参数。
  name: unet
  in_channels: 3
  out_channels: 3
  base_channels: 16

train:
  steps: 300
  batch_size: 4
  learning_rate: 0.001
  weight_decay: 0.0
  loss: l1
  log_every: 25
  val_every: 50
  num_workers: 0
  device: auto
