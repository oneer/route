# 中文说明：Stage2 AI ISP 实验配置 `pseudo raw sidd tiny dncnn l2 300`。
# 作用：集中声明数据集、模型、损失、优化器、训练步数、验证和输出目录。
# 阅读方式：先看 dataset/model/loss 确认实验目标，再看 train/val/output 确认可复现细节。
experiment:
  name: pseudo_raw_sidd_tiny_dncnn_l2_300
  seed: 42
  output_dir: runs/pseudo_raw_sidd_tiny_dncnn_l2_300

data:
  dataset: paired_pseudo_raw
  patch_size: 128
  train_size: 1000
  val_size: 200
  train:
  # 中文说明：batch、学习率、步数、随机种子等训练控制项。
    noisy_dir: datasets/sidd_tiny/train/noisy
    clean_dir: datasets/sidd_tiny/train/clean
  val:
  # 中文说明：验证频率、验证样本数和评估时使用的数据设置。
    noisy_dir: datasets/sidd_tiny/val/noisy
    clean_dir: datasets/sidd_tiny/val/clean
  noise:
    type: pseudo_rggb_from_paired_rgb
    sigma_min: 0.0
    sigma_max: 0.0

model:
  # 中文说明：网络结构名称及宽度、深度等模型超参数。
  name: dncnn
  in_channels: 4
  out_channels: 4
  features: 32
  depth: 5
  residual: true

train:
  steps: 300
  batch_size: 4
  learning_rate: 0.001
  weight_decay: 0.0
  loss: mse
  log_every: 50
  val_every: 100
  num_workers: 0
  device: auto
