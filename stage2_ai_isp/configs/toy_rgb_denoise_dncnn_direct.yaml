# 中文说明：Stage2 AI ISP 实验配置 `toy rgb denoise dncnn direct`。
# 作用：集中声明数据集、模型、损失、优化器、训练步数、验证和输出目录。
# 阅读方式：先看 dataset/model/loss 确认实验目标，再看 train/val/output 确认可复现细节。
experiment:
  name: toy_rgb_denoise_dncnn_direct
  seed: 42
  output_dir: runs/toy_rgb_denoise_dncnn_direct

data:
  patch_size: 64
  train_size: 512
  val_size: 32
  noise:
    type: gaussian
    sigma_min: 0.03
    sigma_max: 0.12

model:
  # 中文说明：网络结构名称及宽度、深度等模型超参数。
  name: dncnn
  in_channels: 3
  out_channels: 3
  features: 32
  depth: 5
  residual: false

train:
  # 中文说明：batch、学习率、步数、随机种子等训练控制项。
  steps: 300
  batch_size: 8
  learning_rate: 0.001
  weight_decay: 0.0
  loss: l1
  log_every: 25
  val_every: 50
  num_workers: 0
  device: auto
