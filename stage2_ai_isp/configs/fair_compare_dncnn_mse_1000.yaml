# 中文说明：Stage2 AI ISP 实验配置 `fair compare dncnn mse 1000`。
# 作用：集中声明数据集、模型、损失、优化器、训练步数、验证和输出目录。
# 阅读方式：先看 dataset/model/loss 确认实验目标，再看 train/val/output 确认可复现细节。
experiment:
  name: fair_compare_dncnn_mse_1000
  seed: 42
  output_dir: runs/fair_compare_dncnn_mse_1000

data:
  dataset: paired_image
  patch_size: 128
  train_size: 1000
  val_size: 200
  augment: false
  train:
  # 中文说明：batch、学习率、步数、随机种子等训练控制项。
    noisy_dir: datasets/sidd_tiny/train/noisy
    clean_dir: datasets/sidd_tiny/train/clean
  val:
  # 中文说明：验证频率、验证样本数和评估时使用的数据设置。
    noisy_dir: datasets/sidd_tiny/val/noisy
    clean_dir: datasets/sidd_tiny/val/clean
  noise:
    type: real_paired_rgb

model:
  # 中文说明：网络结构名称及宽度、深度等模型超参数。
  name: dncnn
  in_channels: 3
  out_channels: 3
  features: 32
  depth: 5
  residual: true

train:
  steps: 1000
  batch_size: 4
  learning_rate: 0.001
  weight_decay: 0.0
  loss: mse
  log_every: 50
  val_every: 200
  num_workers: 0
  device: auto
