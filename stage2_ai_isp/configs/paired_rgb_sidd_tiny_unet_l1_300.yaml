experiment:
  name: paired_rgb_sidd_tiny_unet_l1_300
  seed: 42
  output_dir: runs/paired_rgb_sidd_tiny_unet_l1_300

data:
  dataset: paired_image
  patch_size: 128
  train_size: 600
  val_size: 200
  train:
    noisy_dir: datasets/sidd_tiny/train/noisy
    clean_dir: datasets/sidd_tiny/train/clean
  val:
    noisy_dir: datasets/sidd_tiny/val/noisy
    clean_dir: datasets/sidd_tiny/val/clean
  noise:
    type: real_paired_rgb
    sigma_min: 0.0
    sigma_max: 0.0

model:
  name: unet
  in_channels: 3
  out_channels: 3
  base_channels: 16

train:
  steps: 300
  batch_size: 4
  learning_rate: 0.001
  weight_decay: 0.0
  loss: l1
  log_every: 25
  val_every: 50
  num_workers: 0
  device: auto
