# 中文说明：Stage2 AI ISP 实验配置 `paired rgb smoke dncnn l2`。
# 作用：集中声明数据集、模型、损失、优化器、训练步数、验证和输出目录。
# 阅读方式：先看 dataset/model/loss 确认实验目标，再看 train/val/output 确认可复现细节。
experiment:
  name: paired_rgb_smoke_dncnn_l2
  seed: 42
  output_dir: runs/paired_rgb_smoke_dncnn_l2

data:
  dataset: paired_image
  patch_size: 128
  train_size: 96
  val_size: 24
  train:
  # 中文说明：batch、学习率、步数、随机种子等训练控制项。
    noisy_dir: runs/paired_rgb_smoke/noisy
    clean_dir: runs/paired_rgb_smoke/clean
  val:
  # 中文说明：验证频率、验证样本数和评估时使用的数据设置。
    noisy_dir: runs/paired_rgb_smoke/noisy
    clean_dir: runs/paired_rgb_smoke/clean
  noise:
    type: gaussian
    sigma_min: 0.0
    sigma_max: 0.0

model:
  # 中文说明：网络结构名称及宽度、深度等模型超参数。
  name: dncnn
  in_channels: 3
  out_channels: 3
  features: 32
  depth: 5
  residual: true

train:
  steps: 120
  batch_size: 4
  learning_rate: 0.001
  weight_decay: 0.0
  loss: mse
  log_every: 20
  val_every: 40
  num_workers: 0
  device: auto
