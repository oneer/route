[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "route-ai-isp-portfolio"
version = "0.1.0"
description = "Learning and verification monorepo for traditional ISP, AI restoration, C++ ISP, and deployment experiments."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = []

[tool.setuptools]
packages = []

[tool.route]
repository-kind = "multi-stage-learning-monorepo"
default-python = "3.12"
verification-command = "powershell -ExecutionPolicy Bypass -File tools/verify_project.ps1"
